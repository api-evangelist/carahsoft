aid: carahsoft
name: Carahsoft
description: >-
  Carahsoft Technology Corp. is a master government IT solutions
  aggregator and distributor that resells software, cloud, and
  cybersecurity products from hundreds of technology vendors to U.S.
  federal, state, local, defense, intelligence, healthcare, and
  education customers across 220+ government contract vehicles.
  Carahsoft operates a partner-facing Developer Center that exposes
  partner integrations for accounts, quotes, orders, invoices, price
  lists, purchase orders, and resources; the underlying API is gated
  behind a partner account and is not a public REST API.
